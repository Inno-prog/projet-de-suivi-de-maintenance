<div class="app-layout">
  <!-- Sidebar -->
  <app-sidebar #sidebar (toggleChange)="onSidebarToggle($event)" [isOpen]="sidebarOpen" [class.mobile-open]="sidebarOpen && isMobile"></app-sidebar>

  <!-- Main Content -->
  <div class="main-content" [class.sidebar-open]="sidebarOpen && isMobile">
    <!-- Header -->
    <nav class="navbar">
      <div class="container">
        <div class="nav-brand">
          <!-- Hamburger menu for mobile -->
          <button *ngIf="isMobile" class="sidebar-toggle-nav" (click)="toggleSidebar()">
            <div class="hamburger">
              <span></span><span></span><span></span>
            </div>
          </button>
        </div>

        <div class="nav-menu">
          <!-- Navigation links removed for authenticated users -->
        </div>

        <!-- User Profile + Notifications -->

        <div class="nav-user" *ngIf="currentUser">
          <div class="profile-section" (click)="toggleProfileMenu()">
            <button class="profile-item">
              <div class="user-avatar">
                <i class="fas fa-user"></i>
              </div>
              <div class="user-info">
                <span class="user-name">{{ currentUser.nom }}</span>
                <span class="user-role">{{ getRoleLabel(currentUser.role) }}</span>
              </div>
              <i class="fas fa-chevron-down dropdown-icon" [class.rotated]="profileMenuOpen"></i>
            </button>

            <!-- Profile Dropdown -->
            <div class="profile-dropdown" *ngIf="profileMenuOpen" (clickOutside)="closeProfileMenu()">
              <div class="profile-header">
                <div class="user-avatar-large">
                  <i class="fas fa-user"></i>
                </div>
                <div class="user-details">
                  <h4>{{ currentUser.nom }}</h4>
                  <p>{{ currentUser.email }}</p>
                  <span class="role-badge" [ngClass]="getRoleClass()">
                    {{ getRoleLabel(currentUser.role) }}
                  </span>
                </div>
              </div>

              <!-- Profile Form directly in dropdown -->
              <div class="profile-menu" *ngIf="!showProfileForm && !showSettingsForm">
                <button class="menu-item" (click)="showProfileForm = true; $event.stopPropagation()">
                  <i class="fas fa-user menu-icon"></i>
                  Mon Profil
                </button>
                <button class="menu-item" (click)="showSettingsForm = true; $event.stopPropagation()">
                  <i class="fas fa-cog menu-icon"></i>
                  Paramètres
                </button>
                <hr class="menu-divider">
                <button class="menu-item logout" (click)="logout()">
                  <i class="fas fa-sign-out-alt menu-icon"></i>
                  Déconnexion
                </button>
              </div>

              <!-- Profile Edit Form -->
              <form [formGroup]="profileForm" (ngSubmit)="updateProfile()" *ngIf="showProfileForm" (click)="$event.stopPropagation()">
                <div class="profile-form-content">
                  <div class="form-group">
                    <label>Nom complet</label>
                    <input type="text" class="form-control" formControlName="nom" required>
                  </div>

                  <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" formControlName="email" required>
                  </div>

                  <div class="form-group">
                    <label>Contact</label>
                    <input type="text" class="form-control" formControlName="contact">
                  </div>

                  <div class="form-group">
                    <label>Adresse</label>
                    <textarea class="form-control" formControlName="adresse" rows="2"></textarea>
                  </div>

                  <div *ngIf="authService.isPrestataire()">
                    <div class="form-group">
                      <label>Structure</label>
                      <input type="text" class="form-control" formControlName="structure">
                    </div>

                    <div class="form-group">
                      <label>Direction</label>
                      <input type="text" class="form-control" formControlName="direction">
                    </div>

                    <div class="form-group">
                      <label>Qualification</label>
                      <input type="text" class="form-control" formControlName="qualification">
                    </div>
                  </div>

                  <div class="form-actions">
                    <button type="button" class="btn btn-secondary" (click)="showProfileForm = false; $event.stopPropagation()">
                      Retour
                    </button>
                    <button type="submit" class="btn btn-primary" [disabled]="profileForm.invalid || profileLoading">
                      <i class="fas fa-spinner fa-spin" *ngIf="profileLoading"></i>
                      {{ profileLoading ? 'Sauvegarde...' : 'Sauvegarder' }}
                    </button>
                  </div>
                </div>
              </form>

              <!-- Settings Form -->
              <div class="profile-form-content" *ngIf="showSettingsForm" (click)="$event.stopPropagation()">
                <div class="form-group">
                  <label>Langue de l'interface</label>
                  <select class="form-control">
                    <option>Français</option>
                    <option>English</option>
                  </select>
                </div>

                <div class="form-group">
                  <label>Notifications par email</label>
                  <div class="checkbox-group">
                    <input type="checkbox" id="emailNotif" checked>
                    <label for="emailNotif">Recevoir les notifications par email</label>
                  </div>
                </div>

                <div class="form-group">
                  <label>Notifications push</label>
                  <div class="checkbox-group">
                    <input type="checkbox" id="pushNotif" checked>
                    <label for="pushNotif">Activer les notifications push</label>
                  </div>
                </div>

                <div class="form-group">
                  <label>Affichage</label>
                  <select class="form-control">
                    <option>Mode clair</option>
                    <option>Mode sombre</option>
                    <option>Automatique</option>
                  </select>
                </div>

                <div class="form-group">
                  <label>Fuseau horaire</label>
                  <select class="form-control">
                    <option>GMT+0 (Ouagadougou)</option>
                    <option>GMT+1 (Paris)</option>
                  </select>
                </div>

                <div class="form-group">
                  <label>Format de date</label>
                  <select class="form-control">
                    <option>JJ/MM/AAAA</option>
                    <option>MM/JJ/AAAA</option>
                    <option>AAAA-MM-JJ</option>
                  </select>
                </div>

                <div class="form-actions">
                  <button type="button" class="btn btn-secondary" (click)="showSettingsForm = false; $event.stopPropagation()">
                    Retour
                  </button>
                  <button type="button" class="btn btn-primary" (click)="saveSettings($event)">
                    Enregistrer
                  </button>
                </div>
              </div>
            </div>
          </div>
          <!-- Notification bell placed to the right of profile -->
          <div class="notification-container">
            <app-notification-bell></app-notification-bell>
          </div>
        </div>
      </div>
    </nav>

    <!-- Page Content -->
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" *ngIf="showSettingsModal" (click)="closeSettingsModal()" style="display: flex !important; visibility: visible !important; opacity: 1 !important; z-index: 9999 !important;">
    <div class="modal settings-modal" (click)="$event.stopPropagation()" style="visibility: visible !important; opacity: 1 !important; z-index: 10000 !important;">
      <div class="modal-header">
        <h2>Paramètres</h2>
        <button class="close-btn" (click)="closeSettingsModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="modal-body">
        <p class="mb-4">Gérez vos préférences utilisateur ici.</p>
        <!-- Example settings: notification toggle, theme -->
        <div class="form-group">
          <label>Notifications en temps réel</label>
          <div>
            <button class="btn btn-outline" (click)="showDemoMessage('Paramètre démo', $event)">Modifier</button>
          </div>
        </div>
        <div class="form-group">
          <label>Thème</label>
          <div>
            <button class="btn btn-outline" (click)="showDemoMessage('Changer thème (démo)', $event)">Changer</button>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeSettingsModal()">Fermer</button>
      </div>
    </div>
  </div>

  <!-- Toast Component -->
  <app-toast #toast></app-toast>

  <!-- Confirmation Component -->
  <app-confirmation #confirmation></app-confirmation>
</div>
