<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription réussie - DGSI Maintenance</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-600 to-blue-800 flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-2xl max-w-md w-full mx-4">
        <div class="text-center">
            <!-- Success Icon -->
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 mb-6">
                <svg class="h-8 w-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>

            <h2 class="text-2xl font-bold text-gray-900 mb-2">Inscription réussie !</h2>
            <p class="text-gray-600 mb-6">
                Félicitations ! Votre compte a été créé avec succès.
            </p>
            <p class="text-gray-600 mb-8">
                Vous pouvez maintenant vous connecter pour accéder à votre tableau de bord.
            </p>

            <!-- Login Button - Redirect to Keycloak login -->
            <a href="http://localhost:8080/realms/Maintenance-DGSI/protocol/openid-connect/auth?client_id=maintenance-app&redirect_uri=http://localhost:4200/&response_type=code&scope=openid"
               class="block w-full bg-[rgb(28,82,118)] text-white py-3 px-4 rounded-lg hover:bg-[rgb(28,82,118)] transition-colors font-medium text-center text-lg">
                Se connecter
            </a>

            <!-- Home Link -->
            <p class="mt-4 text-sm text-gray-500">
                <a href="/" class="text-[rgb(28,82,118)] hover:text-[rgb(28,82,118)]">Retour à l'accueil</a>
            </p>
        </div>
    </div>

    <script>
        // Clear any OAuth parameters from URL
        if (window.location.search) {
            // Clean the URL without refresh
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    </script>
</body>
</html>
