<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="#e3f2fd"/>
  
  <!-- Body -->
  <ellipse cx="50" cy="70" rx="35" ry="25" fill="#4a6fa5"/>
  
  <!-- Head -->
  <circle cx="50" cy="35" r="25" fill="#fce4ec"/>
  
  <!-- Hair -->
  <path d="M 25 35 Q 50 10 75 35" fill="#1a365d"/>
  <path d="M 25 35 Q 50 30 75 35" fill="#1a365d"/>
  
  <!-- Eyes -->
  <circle cx="40" cy="32" r="4" fill="#1a365d"/>
  <circle cx="60" cy="32" r="4" fill="#1a365d"/>
  
  <!-- Mouth -->
  <path d="M 40 42 Q 50 45 60 42" stroke="#1a365d" stroke-width="2" fill="none"/>
  
  <!-- Shirt -->
  <rect x="30" y="60" width="40" height="30" fill="#4a6fa5" rx="5"/>
  
  <!-- Tie -->
  <path d="M 50 60 Q 45 70 50 80 Q 55 70 50 60" fill="#c3423f"/>
  
  <!-- Collar -->
  <path d="M 30 60 L 40 65 L 30 70" fill="#4a6fa5"/>
  <path d="M 70 60 L 60 65 L 70 70" fill="#4a6fa5"/>
  
  <!-- Arms -->
  <ellipse cx="20" cy="70" rx="10" ry="20" fill="#4a6fa5"/>
  <ellipse cx="80" cy="70" rx="10" ry="20" fill="#4a6fa5"/>
  
  <!-- Hands -->
  <circle cx="15" cy="70" r="5" fill="#fce4ec"/>
  <circle cx="85" cy="70" r="5" fill="#fce4ec"/>
  
  <!-- Legs -->
  <ellipse cx="40" cy="90" rx="8" ry="15" fill="#4a6fa5"/>
  <ellipse cx="60" cy="90" rx="8" ry="15" fill="#4a6fa5"/>
  
  <!-- Shoes -->
  <rect x="35" y="95" width="10" height="5" fill="#1a365d" rx="2"/>
  <rect x="55" y="95" width="10" height="5" fill="#1a365d" rx="2"/>
</svg>